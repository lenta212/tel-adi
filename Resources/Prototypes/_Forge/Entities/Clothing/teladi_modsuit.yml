# Tel-Adi ARS — основной блок (спина)
- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitTelAdi
  name: модкостюм Tel-Adi ARS
  description: Фирменный модкостюм корпорации Tel-Adi с встроенным джетпаком, расширенным хранилищем и системой повышения мобильности.
  suffix: ТелАди
  components:
  - type: Appearance
  - type: Icon
    sprite: _Mono/Clothing/Back/Modsuits/tel-adi.rsi
    state: control
  - type: Sprite
    sprite: _Mono/Clothing/Back/Modsuits/tel-adi.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealed" ]
  - type: Storage
    grid:
    - 0,0,7,4
    maxItemSize: Huge
  - type: Tag
    tags:
    - GasTank
  - type: ActivatableUI
    key: enum.SharedGasTankUiKey.Key
    verbOnly: true
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.ToggleClothingUiKey.Key:
        type: ToggleableClothingBoundUserInterface
      enum.SharedGasTankUiKey.Key:
        type: GasTankBoundUserInterface
  - type: GasTank
    enableInternals: false
    outputPressure: 21.3
    air:
      volume: 5
      temperature: 293.15
  - type: Jetpack
    moleUsage: 0.00085
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingModsuitHelmetTelAdi
      gloves: ClothingModsuitGauntletsTelAdi
      outerClothing: ClothingModsuitChestplateTelAdi
      shoes: ClothingModsuitBootsTelAdi
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      back:
      - state: equipped-BACKPACK-sealed
  - type: StaticPrice
    price: 20000
    vendPrice: 100000

# Tel-Adi ARS с батарейкой
- type: entity
  parent: ClothingModsuitTelAdi
  id: ClothingModsuitTelAdiPowerCell
  suffix: ТелАди, Батарейка высокой ёмкости
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
        whitelist:
          components:
            - PowerCell
