# Tel-Adi ARS — перчатки с инструментами
- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsTelAdi
  name: перчатки модкостюма Tel-Adi ARS
  description: Перчатки со встроенными инструментами — омнитулом и УРК.
  suffix: ТелАди
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Hands/Modsuits/tel-adi.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      map: [ "sealed" ]
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      gloves:
      - state: equipped-HAND-sealed
      gloves-vox:
      - state: equipped-HAND-sealed-vox
  - type: ModsuitGauntletTools
    urkProto: ShipRepairDeviceModsuitGauntlet
    omnitoolProto: OmnitoolModsuitGauntlet
  - type: ActionGrant
    actions:
    - ActionModsuitGauntletToolsMenu
  - type: ItemActionGrant
    actions:
    - ActionModsuitGauntletToolsMenu
    activeIfWorn: true
  - type: StaticPrice
    price: 5000
    vendPrice: 20000

